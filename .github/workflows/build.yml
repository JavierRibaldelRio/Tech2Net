name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: '.exe'
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_ext: ''
          - os: macos-13
            target: x86_64-apple-darwin
            binary_ext: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Dependencias de sistema (solo Linux) ──────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Sidecar Python ────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r optimizer/requirements.txt

      - name: Build sidecar (PyInstaller)
        run: |
          cd optimizer
          pyinstaller --onefile --collect-all ortools --collect-all xhtml2pdf --collect-all reportlab --name scheduler main.py

      - name: Copy sidecar to Tauri bin (Unix)
        if: matrix.binary_ext == ''
        run: cp optimizer/dist/scheduler Tech2Net/src-tauri/bin/scheduler-${{ matrix.target }}

      - name: Copy sidecar to Tauri bin (Windows)
        if: matrix.binary_ext == '.exe'
        shell: pwsh
        run: Copy-Item optimizer\dist\scheduler.exe Tech2Net\src-tauri\bin\scheduler-${{ matrix.target }}.exe

      # ── App Tauri ─────────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: Tech2Net
        run: npm install

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Tech2Net
          tagName: ${{ github.ref_name }}
          releaseName: 'Tech2Net ${{ github.ref_name }}'
          releaseBody: |
            ## Instalación
            Descarga el instalador correspondiente a tu sistema operativo.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
